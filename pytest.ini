[pytest]
# ---------------------------------------------------------
# Pytest configuration for Ecommerce ERP
# ---------------------------------------------------------

# Where to discover tests
testpaths = tests

# Test file / class / function naming conventions
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Minimum pytest version
minversion = 7.0

# Default command-line options
# -ra              : show short summary for all non-passing tests
# --strict-markers : fail if an unknown @pytest.mark.* is used
# --tb=short       : compact traceback format
# -v               : verbose (show each test name)
addopts =
    -ra
    --strict-markers
    --tb=short
    -v

# Custom markers (used to categorize tests)
markers =
    unit: Fast, isolated unit tests (no DB, no I/O)
    integration: Tests that hit the SQLite DB or filesystem
    slow: Tests that take noticeable time to run
    parsers: Tests for src/core/parsers.py
    finance: Tests for FinanceService (fee calculations)
    gap: Tests for GapService (gap matrix)

# Logging during test runs (useful since the app uses get_logger heavily) [8]
log_cli = false
log_cli_level = WARNING
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Treat these warnings as errors so we catch deprecations early
filterwarnings =
    ignore::DeprecationWarning:pandas.*
    ignore::DeprecationWarning:sqlalchemy.*